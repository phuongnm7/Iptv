name: Sync Super OK playlist

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync_superok_playlist.yml"

permissions:
  contents: write

concurrency:
  group: sync-superok-playlist
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and decrypt latest source playlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sync
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 120 \
            'https://raw.githubusercontent.com/hieu-TQS/ENC/main/playlist.enc' \
            -o .sync/playlist.enc

          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib
          import subprocess

          token = 'dc5521f1fe411d6f2e83c2bf047d6294'
          source = pathlib.Path('.sync/playlist.enc').read_text(encoding='utf-8').strip()
          raw = base64.b64decode(source, validate=True)
          if len(raw) <= 16:
              raise SystemExit('Encrypted playlist is too short')

          iv = raw[:16]
          ciphertext = raw[16:]
          pathlib.Path('.sync/cipher.bin').write_bytes(ciphertext)

          subprocess.run([
              'openssl', 'enc', '-d', '-aes-256-cbc',
              '-K', hashlib.sha256(token.encode('utf-8')).hexdigest(),
              '-iv', iv.hex(),
              '-in', '.sync/cipher.bin',
              '-out', '.sync/SuperOK_playlist.m3u'
          ], check=True)

          text = pathlib.Path('.sync/SuperOK_playlist.m3u').read_text(encoding='utf-8-sig')
          if not text.lstrip().startswith('#EXTM3U'):
              raise SystemExit('Decrypted result is not a valid M3U playlist')
          if '#EXTINF' not in text:
              raise SystemExit('Decrypted playlist contains no channels')

          channels = sum(
              1 for line in text.splitlines()
              if line.lstrip().upper().startswith('#EXTINF')
          )
          print(f'Validated latest playlist: {channels} EXTINF entries')
          PY

      - name: Update M3U only when source changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f SuperOK_playlist.m3u ] && cmp -s .sync/SuperOK_playlist.m3u SuperOK_playlist.m3u; then
            echo "No source change; keeping existing M3U."
            exit 0
          fi

          cp .sync/SuperOK_playlist.m3u SuperOK_playlist.m3u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SuperOK_playlist.m3u
          git commit -m 'Sync Super OK playlist from source'
          git push origin HEAD:main
