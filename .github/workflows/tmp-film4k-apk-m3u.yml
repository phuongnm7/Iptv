name: tmp-film4k-apk-m3u

on:
  push:
    branches:
      - tmp/film4k-apk-m3u-20261002

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current Film4k channels and streams
        env:
          API_BASE: https://fiml4k.fun
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, ssl, time
          BASE = "https://fiml4k.fun"
          ctx = ssl.create_default_context()
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                  return r.geturl(), r.headers.get("content-type",""), r.read()
          final, ct, body = get(BASE + "/api/tv/channels")
          data = json.loads(body)
          channels = data if isinstance(data, list) else data.get("channels", [])
          out = ["#EXTM3U"]
          resolved = 0
          failed = []
          for idx, ch in enumerate(channels, 1):
              cid = str(ch.get("id",""))
              if not cid:
                  failed.append({"id":"","name":ch.get("name",""),"error":"missing id"})
                  continue
              name = str(ch.get("name") or "Unknown")
              logo = str(ch.get("logo") or "")
              group = str(ch.get("group") or "Khác")
              rid = urllib.parse.quote(cid, safe=":")
              try:
                  final2, ct2, body2 = get(f"{BASE}/api/tv/{rid}/stream")
                  url = None
                  clearkey = ch.get("clearKey")
                  try:
                      obj = json.loads(body2)
                      if isinstance(obj, dict):
                          for k in ("url","streamUrl","stream_url","source"):
                              v = obj.get(k)
                              if isinstance(v, str) and v.startswith(("http://","https://")):
                                  url = v
                                  break
                          if clearkey is None:
                              clearkey = obj.get("clearKey")
                  except Exception:
                      pass
                  if not url and final2 and final2.startswith(("http://","https://")) and not (ct2 or "").lower().startswith("application/json"):
                      url = final2
                  if not url:
                      raise RuntimeError(f"resolver returned no stream URL (HTTP content-type={ct2!r})")
                  esc=lambda s: str(s).replace("&","&amp;").replace('"',"&quot;")
                  out.append(f'#EXTINF:-1 tvg-id="{esc(cid)}" tvg-name="{esc(name)}" tvg-logo="{esc(logo)}" group-title="{esc(group)}",{name}')
                  if url.lower().split("?",1)[0].endswith(".mpd"):
                      out.append("#KODIPROP:inputstreamaddon=inputstream.adaptive")
                      out.append("#KODIPROP:inputstream.adaptive.manifest_type=dash")
                      if isinstance(clearkey, dict) and clearkey.get("keyId") and clearkey.get("key"):
                          out.append("#KODIPROP:inputstream.adaptive.license_type=clearkey")
                          out.append(f"#KODIPROP:inputstream.adaptive.license_key={clearkey['keyId']}:{clearkey['key']}")
                  out.append(url)
                  resolved += 1
              except Exception as e:
                  failed.append({"id":cid,"name":name,"error":str(e)})
          open("film4k_apk_resolved.m3u","w",encoding="utf-8").write("\n".join(out)+"\n")
          json.dump({"channelCount":len(channels),"resolved":resolved,"failed":failed},open("film4k_apk_report.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print(json.dumps({"channelCount":len(channels),"resolved":resolved,"failed":len(failed)},ensure_ascii=False))
          if resolved == 0:
              raise SystemExit("No streams resolved")
          PY

      - name: Upload resolved playlist
        uses: actions/upload-artifact@v4
        with:
          name: film4k-apk-resolved-m3u
          path: |
            film4k_apk_resolved.m3u
            film4k_apk_report.json
          if-no-files-found: error
