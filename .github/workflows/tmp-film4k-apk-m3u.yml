name: tmp-film4k-apk-m3u

on:
  push:
    branches:
      - tmp/film4k-apk-m3u-20261002

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current Film4k channels and streams
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, ssl, http.cookiejar, re
          BASES=["https://fiml4k.fun","https://film4k.annnekkk.com","https://film4k.net"]
          BASE=""
          APP_TOKEN="rhLMhSOh/TQCQbuFYWLnYOUoQulZrf4S"
          UA="Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar), urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          base_headers={"User-Agent":UA,"X-F4K-App":"android","X-F4K-App-Token":APP_TOKEN,"Accept":"application/json,text/plain,*/*"}

          def req(url, method="GET", headers=None, data=None):
              h=dict(base_headers); h.update(headers or {})
              rreq=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  r=opener.open(rreq,timeout=30)
                  return r.geturl(),r.status,r.headers.get("content-type",""),dict(r.headers),r.read()
              except urllib.error.HTTPError as e:
                  return e.geturl(),e.code,e.headers.get("content-type",""),dict(e.headers),e.read()

          # Mint a play token using the same app identity as the APK.
          for candidate in BASES:
              extra={
                  "Origin":"https://film4k.net",
                  "Referer":"https://film4k.net/",
                  "Accept-Language":"vi-VN,vi;q=0.9,en-US;q=0.8,en;q=0.7",
                  "Sec-Fetch-Site":"cross-site",
                  "Sec-Fetch-Mode":"cors",
                  "Sec-Fetch-Dest":"empty",
                  "sec-ch-ua-mobile":"?1",
                  "sec-ch-ua-platform":"Android",
              }
              u,s,ct,h,b=req(candidate+"/api/play-ticket",method="POST",headers={**extra,"Content-Type":"application/json"},data=b"")
              print(f"play-ticket {candidate}: HTTP={s} type={ct!r} len={len(b)}")
              if 200 <= s < 300:
                  BASE=candidate
                  txt=b.decode("utf-8","replace")
                  m=re.search(r'"token"\s*:\s*"([^"]+)"',txt)
                  if not m:
                      m=re.search(r'[A-Za-z0-9._~+/-]{20,}',txt)
                  pt=m.group(1) if m and m.lastindex else (m.group(0) if m else "")
                  break
          if not BASE or not pt:
              raise SystemExit("No usable Film4k API alias/play token")
          print(f"usable API alias: {BASE}; token acquired: yes; cookies={len(list(jar))}")

          ph={"X-F4K-PT":pt}
          u,s,ct,h,b=req(BASE+"/api/tv/channels",headers=ph)
          print(f"channels HTTP={s} content-type={ct!r} body_len={len(b)}")
          if s >= 400:
              raise SystemExit("channels request failed")
          data=json.loads(b)
          channels=data if isinstance(data,list) else data.get("channels",[])
          print(f"channels discovered: {len(channels)}")

          out=["#EXTM3U"]
          resolved=0; failed=[]
          for idx,ch in enumerate(channels,1):
              cid=str(ch.get("id","")); name=str(ch.get("name") or "Unknown")
              logo=str(ch.get("logo") or ""); group=str(ch.get("group") or "Khác")
              if not cid:
                  failed.append({"id":"","name":name,"error":"missing id"}); continue
              rid=urllib.parse.quote(cid,safe=":")
              try:
                  u2,s2,ct2,h2,b2=req(f"{BASE}/api/tv/{rid}/stream",headers=ph)
                  body2=b2.decode("utf-8","replace")
                  url=None; ck=ch.get("clearKey")
                  try:
                      obj=json.loads(body2)
                  except Exception:
                      obj=None
                  if isinstance(obj,dict):
                      for k in ("url","streamUrl","stream_url","source"):
                          v=obj.get(k)
                          if isinstance(v,str) and v.startswith(("http://","https://")):
                              url=v; break
                      if ck is None: ck=obj.get("clearKey")
                  if not url and u2.startswith(("http://","https://")) and not ct2.lower().startswith("application/json"):
                      url=u2
                  if not url: raise RuntimeError(f"HTTP {s2}; no stream URL")
                  esc=lambda s:str(s).replace("&","&amp;").replace('"',"&quot;")
                  out.append(f'#EXTINF:-1 tvg-id="{esc(cid)}" tvg-name="{esc(name)}" tvg-logo="{esc(logo)}" group-title="{esc(group)}",{name}')
                  if url.lower().split("?",1)[0].endswith(".mpd"):
                      out += ["#KODIPROP:inputstreamaddon=inputstream.adaptive","#KODIPROP:inputstream.adaptive.manifest_type=dash"]
                      if isinstance(ck,dict) and ck.get("keyId") and ck.get("key"):
                          out += ["#KODIPROP:inputstream.adaptive.license_type=clearkey",f"#KODIPROP:inputstream.adaptive.license_key={ck['keyId']}:{ck['key']}"]
                  out.append(url); resolved+=1
              except Exception as e:
                  failed.append({"id":cid,"name":name,"error":str(e)})
          open("film4k_apk_resolved.m3u","w",encoding="utf-8").write("\n".join(out)+"\n")
          json.dump({"channelCount":len(channels),"resolved":resolved,"failed":failed},open("film4k_apk_report.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print(json.dumps({"channelCount":len(channels),"resolved":resolved,"failed":len(failed)},ensure_ascii=False))
          if resolved == 0: raise SystemExit("No streams resolved")
          PY

      - name: Upload resolved playlist
        uses: actions/upload-artifact@v4
        with:
          name: film4k-apk-resolved-m3u
          path: |
            film4k_apk_resolved.m3u
            film4k_apk_report.json
          if-no-files-found: error
