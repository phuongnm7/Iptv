name: tmp-vtv1-livea-test
on:
  push:
    branches:
      - tmp/film4k-live-fallback-20261002
permissions: contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://live-a.fptplay53.net/live/media/vtv1/live247-hls-avc/index.m3u8" "https://vtvgolive-failover.vtvdigital.vn/vtvgo/vtv1-manifest.m3u8"; do
            echo "=== $u"
            curl -L --connect-timeout 3 --max-time 10 -A 'Mozilla/5.0' -e 'https://fptplay.vn/' -H 'Origin: https://fptplay.vn' -sS -D /tmp/h -o /tmp/b "$u"
            echo "curl=$?"; head -15 /tmp/h 2>/dev/null; echo "BODY:"; head -c 300 /tmp/b 2>/dev/null; echo
          done
