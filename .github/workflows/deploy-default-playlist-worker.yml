name: Deploy NM7 Default Playlist Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-default-playlist-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-default-playlist-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate Worker JavaScript
        run: node --check worker.js

      - name: Deploy existing default Worker without changing its URL
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.toml

      - name: Verify the public default playlist endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://phuongnm7-playlist.phuongnm7-iptv.workers.dev/?nm7_deploy_check=$(date +%s)"
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 "$URL" -o /tmp/nm7-default.m3u
          grep -q '^#EXTM3U' /tmp/nm7-default.m3u
          grep -q '^#EXTINF:' /tmp/nm7-default.m3u
          grep -Fq 'group-title="🌟VTV & VTVCab🌟"' /tmp/nm7-default.m3u
          CHANNELS="$(grep -c '^#EXTINF:' /tmp/nm7-default.m3u)"
          test "$CHANNELS" -ge 10
          echo "Default playlist URL: https://phuongnm7-playlist.phuongnm7-iptv.workers.dev/"
          echo "HTTP response contains a valid M3U with $CHANNELS channels and TV groups."
