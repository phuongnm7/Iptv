name: Update selected IPTV playlist

on:
  push:
    paths:
      - 'merge_selected_playlists.py'
      - '.github/workflows/update-selected-iptv.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build playlist
        run: python3 merge_selected_playlists.py
      - name: Commit playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Iptv_selected.m3u
          git diff --cached --quiet || git commit -m 'Auto-update selected IPTV playlist'
          git push
