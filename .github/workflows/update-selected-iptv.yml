name: Update IPTV playlists

on:
  push:
    paths:
      - 'merge_selected_playlists.py'
      - '.github/workflows/update-selected-iptv.yml'
  schedule:
    - cron: '0-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate preserved SuperOK backup
        shell: bash
        run: |
          set -euo pipefail
          test -s SuperOK_playlist.m3u
          head -n 1 SuperOK_playlist.m3u | grep -q '^#EXTM3U'
          test "$(wc -c < SuperOK_playlist.m3u)" -gt 100000
          echo "Keeping SuperOK_playlist.m3u as a preserved backup; active playlist is built from Dungntk9-owned current sources."

      - name: Build selected playlist
        run: python3 merge_selected_playlists.py

      - name: Commit playlists
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Iptv_selected.m3u
          git diff --cached --quiet || git commit -m 'Auto-update IPTV playlists'
          git push
