name: tmp-film4k-verify

on:
  push:
    branches:
      - tmp/film4k-verify-20261002

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current channel manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, ssl, concurrent.futures
          SRC="https://raw.githubusercontent.com/Gicnycjgfg/film4k-tv/main/film4k_tv.json"
          req=urllib.request.Request(SRC,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as r:
              data=json.load(r)
          channels=data if isinstance(data,list) else data.get("channels",[])
          headers={"User-Agent":"Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/124.0 Safari/537.36","Accept":"*/*"}
          def probe(ch):
              url=ch.get("url") or ch.get("streamUrl")
              if not url: return (str(ch.get("id","")), "NO_URL", False)
              rr=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(rr,timeout=10,context=ssl.create_default_context()) as r:
                      ct=r.headers.get("content-type","")
                      body=r.read(4096)
                      sample=body.decode("utf-8","replace")
                      good=(r.status<400) and (("m3u" in ct.lower()) or ("dash+xml" in ct.lower()) or sample.lstrip().startswith(("#EXTM3U","<?xml","<MPD","{")))
                      return (str(ch.get("id","")), f"HTTP{r.status}_{ct}", good)
              except Exception as e:
                  return (str(ch.get("id","")), type(e).__name__, False)
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              results=list(ex.map(probe,channels))
          status_by_id={x[0]:(x[1],x[2]) for x in results}
          def esc(s): return str(s).replace("&","&amp;").replace('"',"&quot;")
          verified=0
          out=["#EXTM3U"]
          full=["#EXTM3U"]
          failed=[]
          for ch in channels:
              cid=str(ch.get("id","")); name=str(ch.get("name") or "Unknown")
              group=str(ch.get("group") or "Khác"); logo=str(ch.get("logo") or "")
              url=ch.get("url") or ch.get("streamUrl") or ""
              status,good=status_by_id.get(cid,("NOT_TESTED",False))
              line=f'#EXTINF:-1 tvg-id="{esc(cid)}" tvg-name="{esc(name)}" tvg-logo="{esc(logo)}" group-title="{esc(group)}",{name}'
              if url:
                  full += [line,url]
              if good and url:
                  out.append(line)
                  ck=ch.get("clearKey")
                  if str(url).lower().split("?",1)[0].endswith(".mpd"):
                      out += ["#KODIPROP:inputstreamaddon=inputstream.adaptive","#KODIPROP:inputstream.adaptive.manifest_type=dash"]
                      if isinstance(ck,dict) and ck.get("keyId") and ck.get("key"):
                          out += ["#KODIPROP:inputstream.adaptive.license_type=clearkey",f"#KODIPROP:inputstream.adaptive.license_key={ck['keyId']}:{ck['key']}"]
                  out.append(url); verified += 1
              else:
                  failed.append({"id":cid,"name":name,"url":url,"status":status})
          open("film4k_verified.m3u","w",encoding="utf-8").write("\n".join(out)+"\n")
          open("film4k_full_snapshot.m3u","w",encoding="utf-8").write("\n".join(full)+"\n")
          report={"source_generated":data.get("generated") if isinstance(data,dict) else None,"channels":len(channels),"verified":verified,"failed":len(failed),"failed_items":failed}
          json.dump(report,open("film4k_verify_report.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print(json.dumps({k:report[k] for k in ("source_generated","channels","verified","failed")},ensure_ascii=False))
          if verified == 0: raise SystemExit("No verified channels")
          PY
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: film4k-verified-playlists
          path: |
            film4k_verified.m3u
            film4k_full_snapshot.m3u
            film4k_verify_report.json
          if-no-files-found: error
      - name: Publish files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init .
          git checkout -b publish
          git add film4k_verified.m3u film4k_full_snapshot.m3u film4k_verify_report.json
          git commit -m "tmp: publish verified Film4k M3U"
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/phuongnm7/Iptv.git"
          git push --force origin HEAD:tmp/film4k-verify-20261002
        env:
          GITHUB_TOKEN: ${{ github.token }}
