name: Trigger Super OK sync every 5 minutes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superok_sync_scheduler.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: superok-sync-scheduler
  cancel-in-progress: true

jobs:
  trigger-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch playlist sync workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync_superok_playlist.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Triggered sync_superok_playlist.yml"
